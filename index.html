<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalos x PixelFiends - Genesis Checker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

  body {
    margin: 0;
    padding: 0;
    background-color: #050308;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(177, 74, 237, 0.15), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.15), transparent 25%);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    width: 100%;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    position: fixed;
    top: 0;
    z-index: 100;
  }
  .logo { font-weight: 900; font-size: 20px; letter-spacing: 2px; color: #d4af37; }
  .logo span { color: #fff; }
  
  /* Main Container */
  .main-container {
    margin-top: 120px;
    width: 100%;
    max-width: 900px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  /* Titles */
  .title { font-size: 48px; font-weight: 900; text-align: center; margin: 0 0 10px 0; line-height: 1.1; }
  .title span { background: linear-gradient(135deg, #b14aed, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: #888; text-align: center; font-size: 18px; margin-bottom: 40px; }

  /* Glass Box */
  .glass-box {
    background: rgba(20, 15, 30, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    box-sizing: border-box;
    text-align: center;
  }

  /* Inputs */
  input[type="text"] {
    width: 100%;
    padding: 18px 20px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-family: monospace;
    outline: none;
    box-sizing: border-box;
    transition: 0.3s;
    margin-bottom: 20px;
  }
  input[type="text"]:focus {
    border-color: #00e5ff;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 18px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
    background: linear-gradient(135deg, #b14aed, #7a2eb8);
    color: #fff;
    box-shadow: 0 10px 20px rgba(177, 74, 237, 0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(177, 74, 237, 0.5); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Result Section */
  #resultSection { display: none; margin-top: 40px; width: 100%; flex-direction: column; align-items: center; }
  #resultMessage { font-size: 24px; font-weight: 800; margin-bottom: 20px; text-align: center; }
  .success-msg { color: #50dc78; text-shadow: 0 0 10px rgba(80, 220, 120, 0.5); }
  .error-msg { color: #ff006e; text-shadow: 0 0 10px rgba(255, 0, 110, 0.5); }

  /* =========================================
     COOL CARD ANIMATION STYLES 
     ========================================= */
  .canvas-container {
    background: #000;
    border-radius: 16px;
    padding: 10px;
    margin-bottom: 20px;
    max-width: 100%;
    position: relative;
    overflow: hidden; /* Şüşə parıltısı üçün vacibdir */
    
    /* Animasiya başlanğıc vəziyyəti */
    opacity: 0;
    transform: scale(0.7) translateY(40px) rotateX(20deg);
    transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* JS ilə bu klass əlavə olunanda animasiya işə düşür */
  .canvas-container.show-card {
    opacity: 1;
    transform: scale(1) translateY(0) rotateX(0deg);
    animation: neonPulse 3s infinite alternate;
  }

  canvas { max-width: 100%; height: auto; border-radius: 10px; display: block; }

  /* Şüşə parıltısı (Shine) effekti */
  .canvas-container::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 20%;
    height: 200%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
    transform: rotate(30deg);
    opacity: 0;
    pointer-events: none;
  }

  .canvas-container.show-card::after {
    animation: shine 2.5s ease-in-out 0.5s forwards;
  }

  /* Neon Nəbz (Pulse) Animasiyası */
  @keyframes neonPulse {
    0% { 
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(177, 74, 237, 0.4); 
    }
    100% { 
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 60px rgba(0, 229, 255, 0.7); 
    }
  }

  /* Parıltının hərəkəti */
  @keyframes shine {
    0% { left: -60%; opacity: 1; }
    100% { left: 140%; opacity: 1; }
  }

  /* Yükləmə düyməsinin animasiyası */
  .btn-download {
    background: linear-gradient(135deg, #d4af37, #ffaa00);
    color: #000;
    box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
    display: none;
    max-width: 400px;
  }
  .btn-download:hover { box-shadow: 0 15px 25px rgba(212, 175, 55, 0.5); }
</style>

      [arr[i], arr[j]] = [arr[j], arr[i]];

    return arr.slice(0, count);
  }

      fillRect(g, 13, 20, 6, 5, c.shade); px(g, 15, 22, c.accent); px(g, 16, 23, c.accent);
    } else if (sp === 'alien') {
      fillEllipse(g, 16, 11, 10, 11, c.body); fillRect(g, 14, 20, 4, 2, c.body); fillEllipse(g, 16, 26, 7, 5, c.body); fillEllipse(g, 10, 7, 2, 3, c.highlight);
      for (let y=1; y<20; y++) for (let x=6; x<27; x++) { if (g[y] && g[y][x] === c.body && x > 22) g[y][x] = c.shade; }
    } else if (sp === 'mushroom') {
      fillEllipse(g, 16, 13, 13, 8, c.body); fillRect(g, 3, 13, 26, 3, c.body); fillRect(g, 12, 18, 8, 8, c.shade);
      fillRect(g, 11, 18, 1, 8, c.body); fillRect(g, 20, 18, 1, 8, c.body); fillEllipse(g, 10, 11, 2, 1, c.highlight);
      for (let x=4; x<28; x++) { g[15][x] = c.shade; g[16][x] = c.shade; }
    } else if (sp === 'skull') {
      fillEllipse(g, 16, 11, 10, 10, c.body); fillRect(g, 10, 17, 12, 4, c.body); fillRect(g, 12, 21, 8, 1, c.body); fillRect(g, 11, 23, 10, 6, c.body);
      fillRect(g, 6, 5, 1, 16, c.shade); fillRect(g, 25, 5, 1, 16, c.shade);
      for (let i = 0; i < 3; i++) fillRect(g, 11, 24+i*2, 10, 1, c.shade); fillEllipse(g, 16, 18, 3, 2, '#0a0a0a');
    } else if (sp === 'demon') {
      fillRect(g, 8, 3, 2, 6, c.accent); fillRect(g, 22, 3, 2, 6, c.accent); px(g, 8, 2, c.accent); px(g, 23, 2, c.accent);
      fillEllipse(g, 16, 13, 9, 9, c.body); fillEllipse(g, 16, 25, 8, 5, c.body); fillRect(g, 8, 22, 16, 3, c.body);
      for (let y=4; y<30; y++) for (let x=7; x<26; x++) { if (g[y] && g[y][x] === c.body && (x > 22 || y > 26)) g[y][x] = c.shade; }
    } else if (sp === 'crystal') {
      for (let y=4; y<18; y++) { const w = Math.min(y-3, 18-y); for (let x=16-w; x<=16+w; x++) px(g, x, y, c.body); }
      for (let y=18; y<30; y++) { const w = Math.max(1, 8 - Math.floor((y-18)/2)); for (let x=16-w; x<=16+w; x++) px(g, x, y, c.body); }
      for (let y=4; y<18; y++) px(g, 16, y, c.highlight);
      for (let y=4; y<30; y++) for (let x=17; x<28; x++) { if (g[y] && g[y][x] === c.body && x > 19) g[y][x] = c.shade; }
    }
  }

  function applyPattern(g, nft){
    const c = nft.colors; const rng = mulberry32(nft.id * 7 + 3); const isBody = v => v === c.body || v === c.shade || v === c.highlight;
    if (nft.pattern === 'spots') {
      for (let i = 0; i < 10; i++) {
        const cx = Math.floor(rng()*G), cy = Math.floor(rng()*G); const r = 1 + Math.floor(rng()*2);
        for (let y=cy-r; y<=cy+r; y++) for (let x=cx-r; x<=cx+r; x++) { if (g[y] && g[y][x] && isBody(g[y][x])) g[y][x] = c.accent; }
      }
    } else if (nft.pattern === 'stripes') {
      const offset = Math.floor(rng()*3);
      for (let y = 0; y < G; y++) if ((y+offset)%4 === 0) { for (let x = 0; x < G; x++) if (g[y][x] && isBody(g[y][x])) g[y][x] = c.shade; }
    } else if (nft.pattern === 'gradient') {
      for (let y = 0; y < G; y++) { const t = y / G; for (let x = 0; x < G; x++) { if (g[y][x] === c.body && t > 0.55) g[y][x] = c.shade; } }
    }
  }

  function drawEyes(g, nft){
    const h = HEAD_INFO[nft.species]; const c = nft.colors; const cx = 16, cy = h.eyeY, spread = h.eyeSpread;
    if (nft.eye === 'big') {
      fillRect(g, cx-spread-2, cy-1, 3, 3, '#ffffff'); fillRect(g, cx-spread-1, cy, 1, 1, '#000000'); fillRect(g, cx+spread-1, cy-1, 3, 3, '#ffffff'); fillRect(g, cx+spread, cy, 1, 1, '#000000');
      px(g, cx-spread-2, cy-1, c.eye); px(g, cx+spread-1, cy-1, c.eye);
    } else if (nft.eye === 'cyclops') {
      fillEllipse(g, cx, cy, 4, 4, c.eye); fillEllipse(g, cx, cy, 2, 2, '#000000'); px(g, cx-1, cy-1, '#ffffff');
    } else if (nft.eye === 'multi') {
      fillRect(g, cx-7, cy-1, 2, 2, c.eye); fillRect(g, cx-4, cy-2, 2, 2, c.eye); fillRect(g, cx+2, cy-2, 2, 2, c.eye); fillRect(g, cx+5, cy-1, 2, 2, c.eye); fillRect(g, cx-1, cy-3, 2, 2, c.eye); fillRect(g, cx-1, cy+1, 2, 2, c.eye);
    } else if (nft.eye === 'void') {
      fillRect(g, cx-spread-2, cy-1, 3, 2, c.eye); fillRect(g, cx+spread-1, cy-1, 3, 2, c.eye); px(g, cx-spread-1, cy-1, '#ffffff'); px(g, cx+spread, cy-1, '#ffffff');
    } else if (nft.eye === 'sleepy') {
      fillRect(g, cx-spread-2, cy, 3, 1, c.eye); fillRect(g, cx+spread-1, cy, 3, 1, c.eye); px(g, cx-spread-3, cy-1, c.shade); px(g, cx+spread+1, cy-1, c.shade);
    } else if (nft.eye === 'angry') {
      for (let i = 0; i < 3; i++) { px(g, cx-spread-2+i, cy+1-i, c.eye); px(g, cx+spread-i, cy+1-i, c.eye); }
    }
  }

  function drawMouth(g, nft){
    const h = HEAD_INFO[nft.species]; const c = nft.colors; const cx = 16, cy = h.mouthY;
    if (nft.mouth === 'none') return;
    if (nft.mouth === 'smile') { for (let i = -2; i <= 2; i++) { const y = cy + (Math.abs(i) === 2 ? -1 : 0); px(g, cx+i, y, '#0a0a0a'); } }
    else if (nft.mouth === 'fangs') { fillRect(g, cx-3, cy, 6, 1, '#0a0a0a'); px(g, cx-2, cy+1, '#ffffff'); px(g, cx+2, cy+1, '#ffffff'); }
    else if (nft.mouth === 'zigzag') { for (let i = 0; i < 8; i++) px(g, cx-4+i, cy + (i%2), '#0a0a0a'); }
    else if (nft.mouth === 'scream') { fillEllipse(g, cx, cy+1, 3, 3, '#0a0a0a'); fillEllipse(g, cx, cy+2, 2, 1, c.accent); }
  }

  function drawAccessory(g, nft){
    const h = HEAD_INFO[nft.species]; const c = nft.colors; const cx = 16, baseY = h.topY;
    if (nft.accessory === 'horns') {
      fillRect(g, cx-7, baseY-2, 2, 4, c.accent); fillRect(g, cx+5, baseY-2, 2, 4, c.accent); px(g, cx-7, baseY-3, c.accent); px(g, cx+6, baseY-3, c.accent); px(g, cx-8, baseY-4, c.accent); px(g, cx+7, baseY-4, c.accent);
    } else if (nft.accessory === 'antennae') {
      fillRect(g, cx-4, baseY-4, 1, 5, c.accent); fillRect(g, cx+3, baseY-4, 1, 5, c.accent); px(g, cx-4, baseY-5, c.eye); px(g, cx+3, baseY-5, c.eye);
    } else if (nft.accessory === 'halo') {
      const y = baseY - 3; for (let x = cx-6; x <= cx+6; x++) { if (Math.abs(x - cx) >= 3) px(g, x, y, '#ffdd33'); } for (let x = cx-5; x <= cx+5; x++) px(g, x, y+1, '#ffaa00');
    } else if (nft.accessory === 'crown') {
      const y = baseY - 2; for (let x = -3; x <= 3; x++) px(g, cx+x, y, '#ffcc00'); px(g, cx-3, y-1, '#ffcc00'); px(g, cx, y-2, '#ffcc00'); px(g, cx+3, y-1, '#ffcc00'); px(g, cx-3, y-2, '#ff0066'); px(g, cx, y-1, '#00e5ff'); px(g, cx+3, y-2, '#ff0066');
    } else if (nft.accessory === 'hat') {
      const y = baseY - 8; for (let i = 0; i < 6; i++) { for (let x = cx-i; x <= cx+i; x++) px(g, x, y+5-i, c.shade); } for (let x = cx-6; x <= cx+6; x++) px(g, x, y+5, c.accent); px(g, cx, y+2, c.eye); px(g, cx-1, y+3, c.eye); px(g, cx+1, y+3, c.eye); px(g, cx, y+4, c.eye);
    }
  }

  function drawAura(g, nft){
    const rng = mulberry32(nft.id * 1337 + 11); const c = nft.colors;
    if (nft.aura === 'particles') {
      for (let i = 0; i < 16; i++) { const x = Math.floor(rng()*G), y = Math.floor(rng()*G); if (!g[y][x]) g[y][x] = c.eye; }
    } else if (nft.aura === 'rain') {
      for (let i = 0; i < 10; i++) { const x = Math.floor(rng()*G), y = Math.floor(rng()*20); if (!g[y][x]) g[y][x] = c.eye; if (y+1 < G && !g[y+1][x]) g[y+1][x] = c.accent; }
    } else if (nft.aura === 'static') {
      for (let i = 0; i < 30; i++) { const x = Math.floor(rng()*G), y = Math.floor(rng()*G); if (!g[y][x]) g[y][x] = rng() > 0.5 ? c.eye : c.accent; }
    } else if (nft.aura === 'stars') {
      for (let i = 0; i < 8; i++) {
        const x = Math.floor(rng()*G), y = Math.floor(rng()*G);
        if (!g[y][x]) {
          g[y][x] = '#ffffff';
          if (rng() > 0.5 && x+1 < G && !g[y][x+1]) g[y][x+1] = c.eye; if (rng() > 0.5 && x-1 >= 0 && !g[y][x-1]) g[y][x-1] = c.eye;
          if (rng() > 0.5 && y+1 < G && !g[y+1][x]) g[y+1][x] = c.eye; if (rng() > 0.5 && y-1 >= 0 && !g[y-1][x]) g[y-1][x] = c.eye;
        }
      }
    }
  }

  function buildNFT(id){
    const rng = mulberry32(id*2654435761 + 12345);
    const palette = PALETTES[Math.floor(rng()*PALETTES.length)];
    const species = SPECIES[Math.floor(rng()*SPECIES.length)];
    const eye     = EYES[Math.floor(rng()*EYES.length)];
    const mouth   = MOUTHS[Math.floor(rng()*MOUTHS.length)];
    const accessory= ACCESS[Math.floor(rng()*ACCESS.length)];
    const aura    = AURAS[Math.floor(rng()*AURAS.length)];
    const pattern = PATTERNS[Math.floor(rng()*PATTERNS.length)];
    return {id, palette, species, eye, mouth, accessory, aura, pattern, colors:{...palette}};
  }

  function drawCharacterToCanvas(ctx, g, xOffset, yOffset, scale){
    for(let y=0; y<G; y++){
      for(let x=0; x<G; x++){
        if(g[y][x]){
          ctx.fillStyle = g[y][x];
          ctx.fillRect(xOffset + x*scale, yOffset + y*scale, scale, scale);
        }
      }
    }
  }

  // ==========================================
  // 4. CHECK & GENERATE LOGIC
  // ==========================================
  const canvas = document.getElementById('cardCanvas');
  const ctx = canvas.getContext('2d');
  
  function checkWallet() {
    const address = document.getElementById('walletInput').value.trim().toLowerCase();
    const resultSection = document.getElementById('resultSection');
    const resultMessage = document.getElementById('resultMessage');
    const canvasContainer = document.getElementById('canvasContainer');
    const downloadBtn = document.getElementById('downloadBtn');

    if (!address || !address.startsWith('0x') || address.length < 10) {
      alert("Please enter a valid wallet address (must start with 0x).");
      return;
    }

    resultSection.style.display = 'flex';
    
    const isEligible = eligibleWallets.includes(address);

    if (isEligible) {
      resultMessage.className = "success-msg";
      resultMessage.innerText = "🎉 CONGRATULATIONS! You are a Genesis Holder.";
      
      // KART ANIMASIYASI ÜÇÜN
      canvasContainer.classList.remove('show-card'); // Əvvəlki animasiyanı sıfırla
      void canvasContainer.offsetWidth; // Brauzeri məcbur et ki, yenidən hesablasın (reflow)
      
      canvasContainer.style.display = 'block';
      downloadBtn.style.display = 'block';
      
      const walletHash = address.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
      const randomStyle = (walletHash % 3) + 1;
      const nftId = (walletHash % 1111) + 1;

      generateCard(randomStyle, nftId, address);

      // Animasiyanı işə sal
      setTimeout(() => {
        canvasContainer.classList.add('show-card');
      }, 50);
      
    } else {
      resultMessage.className = "error-msg";
      resultMessage.innerText = "❌ Unfortunately, this wallet is not in the winners list.";
      canvasContainer.style.display = 'none';
      downloadBtn.style.display = 'none';
    }
  }

  function generateCard(style, id, walletAddress) {
    const W = canvas.width, H = canvas.height;
    const shortWallet = walletAddress.substring(0, 6) + "..." + walletAddress.substring(walletAddress.length - 4);
    
    const nft = buildNFT(id);
    const grid = makeGrid();
    drawBody(grid, nft);
    applyPattern(grid, nft);
    drawEyes(grid, nft);
    drawMouth(grid, nft);
    drawAccessory(grid, nft);
    drawAura(grid, nft);

    ctx.fillStyle = '#050308'; ctx.fillRect(0, 0, W, H);

    if (style === 1) {
      const grad = ctx.createLinearGradient(50, 50, W-50, H-50);
      grad.addColorStop(0, '#222'); grad.addColorStop(0.5, '#111'); grad.addColorStop(1, '#1a1a1a');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(30, 30, W-60, H-60, 20); ctx.fill();
      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 4; ctx.stroke();
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.3)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(45, 45, W-90, H-90, 15); ctx.stroke();
      
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#d4af37'; ctx.font = '900 50px "Courier New"'; ctx.fillText('PIXELFIENDS', 80, 80);
      ctx.fillStyle = '#888'; ctx.font = 'bold 20px "Segoe UI"'; ctx.fillText('KALOS GENESIS HOLDER', 80, 145);
      ctx.fillStyle = '#d4af37'; ctx.fillRect(80, 180, 400, 2);
      
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px "Segoe UI"'; ctx.fillText('UTILITY', 80, 220);
      ctx.fillStyle = '#aaa'; ctx.font = '18px "Segoe UI"'; ctx.fillText(`Species: ${nft.species.toUpperCase()}`, 80, 260);
      ctx.fillText(`Palette: ${nft.palette.name}`, 80, 290);
      
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#d4af37'; ctx.font = 'bold 55px "Courier New"'; ctx.fillText('1', 80, 365);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 32px "Segoe UI"'; ctx.fillText('MINT', 120, 365);
      
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#555'; ctx.font = '16px "Courier New"'; ctx.fillText(`ID: #${id} | ${shortWallet}`, 80, 480);

      const winX = 550, winY = 80, winW = 380, winH = 380;
      ctx.fillStyle = nft.palette.bg; ctx.beginPath(); ctx.roundRect(winX, winY, winW, winH, 15); ctx.fill();
      
      ctx.shadowColor = nft.palette.accent; ctx.shadowBlur = 30; 
      ctx.strokeStyle = nft.palette.accent; ctx.lineWidth = 4; ctx.stroke(); 
      ctx.shadowBlur = 0;
      
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
      for(let i = winX; i < winX + winW; i += 30) { ctx.beginPath(); ctx.moveTo(i, winY); ctx.lineTo(i, winY+winH); ctx.stroke(); }
      for(let i = winY; i < winY + winH; i += 30) { ctx.beginPath(); ctx.moveTo(winX, i); ctx.lineTo(winX+winW, i); ctx.stroke(); }

      const scale = 10; const cW = G * scale;
      drawCharacterToCanvas(ctx, grid, winX + (winW - cW)/2, winY + (winH - cW)/2, scale);
      
      ctx.fillStyle = '#d4af37'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = 'bold 18px "Segoe UI"'; 
      ctx.fillText('KALOS X THE PIXELFIENDS', winX + winW/2, 500);

    } 
    else if (style === 2) {
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.1)'; ctx.lineWidth = 1;
      for(let i=0; i<W; i+=30) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
      for(let i=0; i<H; i+=30) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }
      ctx.fillStyle = 'rgba(10, 0, 20, 0.8)'; ctx.fillRect(0, 0, W, H);
      
      ctx.strokeStyle = '#ff006e'; ctx.lineWidth = 3; ctx.shadowColor = '#ff006e'; ctx.shadowBlur = 15; 
      ctx.beginPath(); ctx.roundRect(30, 30, W-60, H-60, 10); ctx.stroke(); ctx.shadowBlur = 0;
      
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.fillStyle = '#00e5ff'; ctx.font = 'bold 55px "Courier New"'; ctx.fillText('PIXELFIENDS', 80, 90);
      ctx.fillStyle = '#ff006e'; ctx.font = 'bold 22px "Courier New"'; ctx.fillText('> KALOS GENESIS HOLDER_', 80, 160);
      ctx.fillStyle = '#00e5ff'; ctx.fillRect(80, 190, 400, 2);
      
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px "Courier New"'; ctx.fillText('[ UTILITY ]', 80, 230);
      ctx.fillStyle = '#aaa'; ctx.font = '18px "Courier New"'; 
      ctx.fillText(`> ${nft.species} // ${nft.eye}`, 80, 270); 
      ctx.fillText(`> ${nft.palette.name}`, 80, 300);
      
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#00e5ff'; ctx.font = 'bold 60px "Courier New"'; ctx.fillText('1', 80, 370);
      ctx.fillStyle = '#ff006e'; ctx.font = 'bold 36px "Courier New"'; ctx.fillText('MINT', 130, 370);
      
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#555'; ctx.font = '16px "Courier New"'; ctx.fillText(`ID: #${id} | ${shortWallet}`, 80, 480);

      const winX = 550, winY = 80, winW = 380, winH = 380;
      ctx.fillStyle = 'rgba(0, 229, 255, 0.05)'; ctx.beginPath(); ctx.roundRect(winX, winY, winW, winH, 10); ctx.fill();
      
      ctx.strokeStyle = nft.palette.body; ctx.lineWidth = 3; ctx.shadowColor = nft.palette.body; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.roundRect(winX, winY, winW, winH, 10); ctx.stroke(); ctx.shadowBlur = 0;
      
      const scale = 10; const cW = G * scale;
      drawCharacterToCanvas(ctx, grid, winX + (winW - cW)/2, winY + (winH - cW)/2, scale);
    }
    else {
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, '#1a0b2e'); bg.addColorStop(0.5, '#3a1c71'); bg.addColorStop(1, nft.palette.bg);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(30, 30, W-60, H-60, 30); ctx.fill(); ctx.stroke();
      
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      ctx.fillStyle = '#fff'; ctx.font = '900 55px "Segoe UI"'; ctx.fillText('PIXELFIENDS', 80, 90);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; ctx.font = 'bold 22px "Segoe UI"'; ctx.fillText('KALOS GENESIS HOLDER', 80, 160);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px "Segoe UI"'; ctx.fillText('UTILITY', 80, 230);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.font = '18px "Segoe UI"'; 
      ctx.fillText(`Type: ${nft.species.toUpperCase()}`, 80, 270); 
      ctx.fillText(`Accessory: ${nft.accessory.toUpperCase()}`, 80, 300);
      
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff'; ctx.font = 'bold 55px "Segoe UI"'; ctx.fillText('1', 80, 370);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.font = 'bold 32px "Segoe UI"'; ctx.fillText('MINT', 120, 370);
      
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '16px "Segoe UI"'; ctx.fillText(`ID: #${id} | ${shortWallet}`, 80, 480);

      const winX = 550, winY = 80, winW = 380, winH = 380;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; ctx.beginPath(); ctx.roundRect(winX, winY, winW, winH, 20); ctx.fill();
      
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; 
      ctx.shadowColor = nft.palette.highlight; ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.roundRect(winX, winY, winW, winH, 20); ctx.stroke(); ctx.shadowBlur = 0;
      
      const scale = 10; const cW = G * scale;
      drawCharacterToCanvas(ctx, grid, winX + (winW - cW)/2, winY + (winH - cW)/2, scale);
    }
  }

  function downloadCard() {
    const address = document.getElementById('walletInput').value.trim();
    const link = document.createElement('a');
    link.download = `Kalos_Genesis_Pass_${address.substring(0,6)}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>
